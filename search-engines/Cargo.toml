[package]
name = "search-engines"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = "0.12.24"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
percent-encoding = "2.3.2"
async-trait = "0.1.89"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
